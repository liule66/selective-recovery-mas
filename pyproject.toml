[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srmas"
version = "0.1.0"
description = "Dependency-aware selective recovery in multi-agent workflows (CSE 291A project)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "pydantic>=2.0",
    "pyyaml",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
